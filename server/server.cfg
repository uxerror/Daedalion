[server]
; Local UDP interface. Use "*" or the LAN interface address for remote clients.
bind="127.0.0.1"
; UDP port 1..65535.
port=7777
; Transport ceiling for remote peers. Set to the number tested on your hardware.
max_players=4095
; Writable root for identities.cfg and worlds/. The systemd unit overrides this.
save_dir="user://net/server"
; One portable directory name below worlds/.
world="default"
; Seconds between dirty autosaves. Zero disables the periodic check.
autosave_seconds=60
; First room for a new world. Existing worlds resume their committed room.
level="res://addons/cogito/DemoScenes/COGITO_4_Laboratory.tscn"
; Empty-room policy: stream, keep_visited or preload_all.
level_residency="stream"
; Seconds before an empty room unloads or freezes.
level_grace_seconds=60
; Scene paths or UIDs for preload_all. Include "auto" to follow transition zones.
preload_levels=[]
; Seconds allowed per preparation/readiness phase of a transfer.
travel_timeout_seconds=30
; Whether players may damage one another.
friendly_fire=true
; Nonnegative delay before a dead player may request respawn.
respawn_delay=10.0
; Optional content compatibility string. Omit to follow the bundled plugin.cfg version.
; content_version="1.3.1"
; Listen host label. Dedicated servers have no local player.
display_name="Host"
; One-shot stopped-world command. Empty starts normal service.
profile_command=""
; Copy a solo save into a new world. Clear both fields after the first import.
import_slot=""
; Dedicated import recipient's server-issued player ID.
import_player=""
